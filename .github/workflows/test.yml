name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - run: bundle exec rspec

      # loader.rb is generated from lib/ and published to npm; check that the
      # build still produces valid Ruby.
      - name: Build loader.rb
        run: |
          bundle exec rake build
          ruby -wc loader.rb
