<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>picoruby-importmap: webxr-ruby placement check</title>
</head>
<body>
<pre id="log"></pre>
<!--
  webxr-ruby loads its files with require_relative, which PicoRuby.wasm does
  not define yet. This page only preloads the library and checks that every
  file is in the VFS at the same relative position as on GitHub.
-->
<script type="text/ruby-importmap">
{
  "imports": {
    "webxr": "https://cdn.jsdelivr.net/gh/ydah/webxr-ruby@79f501ec93e35febea9f871138f50e61254c97f9/lib/webxr.rb"
  },
  "integrity": {
    "https://cdn.jsdelivr.net/gh/ydah/webxr-ruby@79f501ec93e35febea9f871138f50e61254c97f9/lib/webxr/version.rb": "sha384-XV7O1aG58K7zXij3wQ6GLDvWMr1UNKPrZKEXcjnxNxikUc6pwgy6mvD037cSsDaL"
  },
  "preload": ["webxr"]
}
</script>
<script>
  for (const name of ["picoruby-importmap:ready", "picoruby-importmap:error"]) {
    document.addEventListener(name, (e) => console.log(name, JSON.stringify({ ...e.detail, files: e.detail.files?.length })));
  }
</script>
<script type="text/ruby" src="../../loader.rb"></script>
<script type="text/ruby-app">
require "js"
root = "/lib/cdn.jsdelivr.net/gh/ydah/webxr-ruby@79f501ec93e35febea9f871138f50e61254c97f9/lib"

def walk(dir, out)
  Dir.entries(dir).each do |e|
    next if e == "." || e == ".."
    path = "#{dir}/#{e}"
    File.directory?(path) ? walk(path, out) : out << path
  end
  out
end

files = walk(root, [])
missing = []
files.each do |f|
  File.read(f).each_line do |line|
    s = line.strip
    next unless s.start_with?("require_relative")
    rel = s.split('"')[1] || s.split("'")[1]
    target = File.expand_path(rel + ".rb", File.dirname(f))
    missing << "#{f} -> #{target}" unless File.file?(target)
  end
end
msg = "webxr files: #{files.size}, unresolved require_relative: #{missing.size}, stub: #{File.read('/lib/webxr.rb').inspect}"
JS.document.getElementById("log")[:textContent] = msg
JS.global[:console].log("[check] " + msg)
missing.each { |m| JS.global[:console].log("[check] missing " + m) }
</script>
<script src="https://cdn.jsdelivr.net/npm/@picoruby/wasm-wasi@4.0.5/dist/init.iife.js"></script>
</body>
</html>
